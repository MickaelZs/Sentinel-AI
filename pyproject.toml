[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ai"
version = "0.1.0"
description = "Foundation for an intelligent transaction-risk investigation platform."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
authors = [
  { name = "Sentinel AI Contributors" },
]
dependencies = [
  "alembic>=1.19.2",
  "fastapi>=0.141.1",
  "joblib>=1.6.0",
  "langgraph>=1.2,<1.3",
  "numpy>=2.5.3",
  "pandas>=3.0.5",
  "pydantic>=2.13.5,<3",
  "pydantic-settings>=2.15.0",
  "psycopg>=3.3.5",
  "scikit-learn>=1.9.0",
  "sqlalchemy>=2.0.52,<3",
  "uvicorn>=0.52.4",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "mypy>=1.19",
  "pandas-stubs>=3.0.0",
  "pytest>=9.0",
  "pytest-cov>=7.0",
  "ruff>=0.15",
  "scikit-learn-stubs>=0.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["joblib"]
ignore_missing_imports = true
